[project]
name = "memsystem-service"
version = "0.1.0"
description = "MCP service for hierarchical agent memory"
requires-python = ">=3.12"
dependencies = [
  "mcp[cli]==2.1.1",
  "numpy>=2.0",
  "pgvector==0.5.0",
  "psycopg[binary]==3.3.5",
  "turbovec==1.0.0",
]

[dependency-groups]
dev = [
    "fastembed==0.8.0",
    "pyarrow>=18",
    "pytest>=8",
]
qwen = [
    "torch==2.11.0",
    "transformers==5.15.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memsystem"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
