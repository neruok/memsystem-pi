services:
  postgres:
    image: pgvector/pgvector@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
    environment:
      POSTGRES_DB: memsystem
      POSTGRES_PASSWORD: postgres
      MEMSYSTEM_SERVICE_PASSWORD: memsystem
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d memsystem"]
      interval: 2s
      timeout: 5s
      retries: 15
    volumes:
      - memsystem-postgres:/var/lib/postgresql/data
      - ./service/db/init:/docker-entrypoint-initdb.d:ro

volumes:
  memsystem-postgres:
